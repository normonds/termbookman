[package]
name = "rust-dashboard"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
chrono = "0.4"

[dependencies]
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
sysinfo = "0.30"
portable-pty = "0.8"
vt100 = "0.16.2"
chrono = "0.4.44"
arboard = "3.4.1"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
directories = "5.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }
serde_json = "1.0"
libc = "0.2"
sha2 = "0.10"
unicode-width = "0.1"

[patch.crates-io]
vt100 = { path = "patch/vt100" }
